<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The Bear Guardian — Revision Checklist</title>
<style>
  :root{
    --surface-page:#f6f5f1;
    --surface-card:#ffffff;
    --surface-muted:#f0efe9;
    --text-primary:#1f1e1a;
    --text-secondary:#6b6a63;
    --text-muted:#98978f;
    --border:#e2e0d6;
    --border-strong:#cfccc0;
    --accent:#3c3489;
    --accent-bg:#eeedfe;
    --critical:#791f1f;
    --critical-bg:#fcebeb;
    --high:#712b13;
    --high-bg:#faece7;
    --medium:#633806;
    --medium-bg:#faeeda;
    --done:#085041;
    --done-bg:#e1f5ee;
    --radius:10px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --surface-page:#1c1b18;
      --surface-card:#242320;
      --surface-muted:#2b2a26;
      --text-primary:#f1efe8;
      --text-secondary:#b4b2a9;
      --text-muted:#888780;
      --border:#3a3934;
      --border-strong:#4a4943;
      --accent:#cecbf6;
      --accent-bg:#3c3489;
      --critical:#f7c1c1;
      --critical-bg:#4a1b0c;
      --high:#f0997b;
      --high-bg:#4a1b0c;
      --medium:#fac775;
      --medium-bg:#412402;
      --done:#9fe1cb;
      --done-bg:#04342c;
    }
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--surface-page);
    color:var(--text-primary);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    line-height:1.5;
    padding:2rem 1rem 5rem;
  }
  .wrap{max-width:760px;margin:0 auto;}
  h1{font-size:22px;font-weight:600;margin:0 0 4px;}
  .subtitle{color:var(--text-secondary);font-size:14px;margin:0 0 24px;}

  .overall{
    background:var(--surface-card);
    border:0.5px solid var(--border);
    border-radius:var(--radius);
    padding:16px 20px;
    margin-bottom:24px;
    display:flex;
    align-items:center;
    gap:16px;
  }
  .overall-ring{
    width:56px;height:56px;border-radius:50%;
    flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    font-size:14px;font-weight:600;
    background:conic-gradient(var(--accent) calc(var(--pct,0)*1%), var(--surface-muted) 0);
  }
  .overall-ring-inner{
    width:44px;height:44px;border-radius:50%;
    background:var(--surface-card);
    display:flex;align-items:center;justify-content:center;
    font-size:13px;font-weight:600;
  }
  .overall-text{font-size:14px;color:var(--text-secondary);}
  .overall-text strong{color:var(--text-primary);font-weight:600;}

  .controls{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;}
  button.tool{
    font-size:13px;
    padding:6px 12px;
    border-radius:8px;
    border:0.5px solid var(--border-strong);
    background:var(--surface-card);
    color:var(--text-secondary);
    cursor:pointer;
  }
  button.tool:hover{background:var(--surface-muted);}

  details.pass{
    background:var(--surface-card);
    border:0.5px solid var(--border);
    border-radius:12px;
    margin-bottom:14px;
    overflow:hidden;
  }
  details.pass[open] summary{border-bottom:0.5px solid var(--border);}
  summary{
    list-style:none;
    cursor:pointer;
    padding:16px 18px;
    display:flex;
    align-items:center;
    gap:12px;
  }
  summary::-webkit-details-marker{display:none;}
  .chev{
    font-size:11px;color:var(--text-muted);
    transition:transform .15s ease;
    flex-shrink:0;
  }
  details[open] .chev{transform:rotate(90deg);}
  .pass-title{font-size:15px;font-weight:600;flex:1;min-width:0;}
  .pass-sub{font-size:12px;color:var(--text-muted);font-weight:400;display:block;margin-top:2px;}
  .pass-progress{
    font-size:12px;color:var(--text-secondary);
    display:flex;align-items:center;gap:8px;flex-shrink:0;
  }
  .bar{
    width:64px;height:5px;border-radius:3px;
    background:var(--surface-muted);overflow:hidden;
  }
  .bar-fill{height:100%;background:var(--accent);border-radius:3px;}

  .section-label{
    font-size:12px;font-weight:600;color:var(--text-secondary);
    text-transform:uppercase;letter-spacing:.03em;
    padding:14px 18px 6px;
  }
  .item{
    display:flex;
    gap:10px;
    padding:9px 18px 9px 14px;
    border-top:0.5px solid var(--border);
  }
  .item:first-of-type{border-top:none;}
  .item input[type=checkbox]{
    margin-top:3px;
    width:16px;height:16px;
    flex-shrink:0;
    accent-color:var(--accent);
    cursor:pointer;
  }
  .item-body{flex:1;min-width:0;}
  .item-text{font-size:14px;line-height:1.45;}
  .item.done .item-text{color:var(--text-muted);text-decoration:line-through;}
  .item-loc{
    font-size:12px;color:var(--text-muted);
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    margin-top:2px;
  }
  .item-row{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:10px;
  }
  .note-toggle{
    flex-shrink:0;
    font-size:11px;
    color:var(--text-muted);
    background:none;
    border:none;
    cursor:pointer;
    padding:2px 0;
    text-decoration:underline;
    text-underline-offset:2px;
  }
  .note-toggle:hover{color:var(--text-secondary);}
  .note-toggle.has-note{color:var(--accent);}
  .note-input{
    display:none;
    width:100%;
    margin-top:8px;
    font-family:inherit;
    font-size:13px;
    line-height:1.4;
    color:var(--text-primary);
    background:var(--surface-muted);
    border:0.5px solid var(--border);
    border-radius:8px;
    padding:8px 10px;
    resize:vertical;
    min-height:52px;
  }
  .note-input:focus{outline:none;border-color:var(--border-strong);}
  .note-input.open{display:block;}
  .note-saved{
    font-size:11px;color:var(--text-muted);
    margin-top:3px;
    opacity:0;
    transition:opacity .2s ease;
  }
  .note-saved.show{opacity:1;}
  .badge{
    display:inline-block;
    font-size:10px;font-weight:600;
    padding:2px 7px;
    border-radius:99px;
    margin-left:8px;
    vertical-align:middle;
    white-space:nowrap;
  }
  .badge.critical{background:var(--critical-bg);color:var(--critical);}
  .badge.high{background:var(--high-bg);color:var(--high);}
  .badge.medium{background:var(--medium-bg);color:var(--medium);}
  .badge.last{background:var(--surface-muted);color:var(--text-secondary);}

  .note{
    font-size:13px;color:var(--text-secondary);
    padding:12px 18px 16px;
    border-top:0.5px solid var(--border);
    background:var(--surface-muted);
  }
  .note strong{color:var(--text-primary);}

  .legend{
    display:flex;gap:14px;flex-wrap:wrap;
    font-size:12px;color:var(--text-secondary);
    margin-bottom:20px;
  }
  .legend span{display:flex;align-items:center;gap:6px;}
  .dot{width:8px;height:8px;border-radius:50%;}

  .save-toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--text-primary);color:var(--surface-page);
    font-size:13px;padding:8px 16px;border-radius:8px;
    opacity:0;transition:opacity .2s ease, transform .2s ease;
    pointer-events:none;
  }
  .save-toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div class="wrap">
  <h1>The Bear Guardian — revision checklist</h1>
  <p class="subtitle">Check items off as you go. Progress saves automatically.</p>

  <div class="overall">
    <div class="overall-ring" id="overallRing" style="--pct:0">
      <div class="overall-ring-inner" id="overallPct">0%</div>
    </div>
    <div class="overall-text" id="overallText">0 of 0 items complete</div>
  </div>

  <div class="legend">
    <span><span class="dot" style="background:var(--critical)"></span>Critical</span>
    <span><span class="dot" style="background:var(--high)"></span>High</span>
    <span><span class="dot" style="background:var(--medium)"></span>Medium</span>
    <span><span class="dot" style="background:var(--text-secondary)"></span>Do last</span>
  </div>

  <div class="controls">
    <button class="tool" id="expandAll">Expand all</button>
    <button class="tool" id="collapseAll">Collapse all</button>
    <button class="tool" id="resetAll">Reset progress</button>
  </div>

  <div id="passList"></div>
</div>

<div class="save-toast" id="toast">Progress reset</div>

<script>
const DATA = [
  {
    id: "pass1",
    title: "Pass 1 — Completion & continuity repair",
    sub: "Make the manuscript a manuscript.",
    sections: [
      {
        label: "Kill the draft artifacts — critical",
        items: [
          { id:"p1-throne", text:"Corrupted / garbled prose fixed", loc:"Page 19, Throne Room", tag:"critical" },
          { id:"p1-table1", text:"Embedded editorial dev table removed", loc:"Pages 29–30", tag:"critical" },
          { id:"p1-table2", text:"Embedded dev table removed (spoils Nyara's death)", loc:"Pages 35–36", tag:"critical" },
          { id:"p1-table3", text:"Embedded dev table removed", loc:"Pages 40–41", tag:"critical" },
          { id:"p1-heading", text:'Stray heading removed: "Rían - R (3 beats to edit)"', loc:"Page 80", tag:"critical" },
          { id:"p1-brackets1", text:"Bracketed direction notes resolved into real prose (pressure / resistance / introspection beats)", loc:"Pages 81–82", tag:"critical" },
          { id:"p1-blank", text:"Blank placeholder area filled in", loc:"Page 82", tag:"critical" },
          { id:"p1-movement", text:'"<<MORE PHYSICAL MOVEMENT HERE>>" written in — where the Bear reacts and collapses', loc:"Page 84", tag:"critical" },
          { id:"p1-village", text:"Village/frantic-POV placeholder written in", loc:"Page 104", tag:"critical" },
          { id:"p1-mismatch", text:"Mismatched bracket fixed: {person of interest]", loc:"Near the Elders", tag:"critical" },
          { id:"p1-clumsy", text:'Stray editorial comment removed: "It was a clumsy delivery,"', loc:"Page 235", tag:"critical" },
          { id:"p1-veils", text:'Unclear standalone "The Veils" resolved (subheading vs. narration)', loc:"Page 291", tag:"critical" },
          { id:"p1-bracket338", text:"Stray closing bracket removed after dialogue", loc:"Page 338", tag:"critical" },
          { id:"p1-partI", text:'"PART II" reconciled with missing "PART I" marker', loc:"Part structure", tag:"critical" },
          { id:"p1-headings", text:"Chapter heading style standardized (emoji use, capitalization, POV tags)", loc:"Throughout", tag:"critical" }
        ]
      },
      {
        label: "Standardize names — critical",
        items: [
          { id:"p1-name-aurelian", text:"Aurelian — pick one spelling (vs. Aurlien, Aurelien, Aurliean, Aurlelian)", tag:"critical" },
          { id:"p1-name-rian", text:"Rían — pick one spelling (vs. Rian, Ryan)", tag:"critical" },
          { id:"p1-name-orlien", text:"Orlíen — pick one spelling (vs. Orlien, Orlirn)", tag:"critical" },
          { id:"p1-name-astraen", text:"Astraen/Astrean — choose one", tag:"critical" },
          { id:"p1-name-goddess", text:"Confirm Maevira/Minvaera/Minevaera/Mineveara is one goddess, standardize spelling", tag:"critical" },
          { id:"p1-name-vaela", text:"Vaela — pick one spelling (vs. Valea, Veala)", tag:"critical" },
          { id:"p1-name-godric", text:"Godric Moore — pick one spelling (vs. Moor)", tag:"critical" },
          { id:"p1-name-spector", text:"Spector/Spectre — pick one", tag:"critical" },
          { id:"p1-name-talauvmor", text:"Talauvmor/Taluavmor — pick one", tag:"critical" },
          { id:"p1-name-misc", text:"Remaining variants standardized: Maren/Maeren, Byrnna/Brynna, Cider/Cyder, Gwyrionez variants, Syrithien/Velomora, Sha'thi/Shai'thi, Astralist/Astralis", tag:"critical" },
          { id:"p1-name-order", text:'"Order of Divinity" vs. "Divinity of Order" — pick one', tag:"critical" }
        ]
      },
      {
        label: "Fix continuity and logic errors — high",
        items: [
          { id:"p1-journal-date", text:"Rían's journal timeline fixed (\"three days ago\" vs. weeks elapsed)", tag:"high" },
          { id:"p1-hunt-days", text:'Hunt day-count standardized ("third day" vs. "four grueling days")', tag:"high" },
          { id:"p1-elder-roster", text:"Elder roster fixed (Agon/Agin, Athos addition)", tag:"high" },
          { id:"p1-ursa", text:"Ursa's disappearance from the Bear's last stand addressed", tag:"high" },
          { id:"p1-rian-hand", text:"Rían's likely-broken hand followed through or softened", tag:"high" },
          { id:"p1-interception", text:"Rían/Orlíen's arrival at the exact Veil given a causal beat", tag:"high" },
          { id:"p1-moonstone", text:"Moonstone-removal reasoning clarified at the climax", tag:"high" },
          { id:"p1-prologue-woman", text:"Prologue's burned woman confirmed as Book Two seed, or echoed in Book One", tag:"high" }
        ]
      }
    ],
    note: "Exit criteria: you can read start to finish without hitting a bracket, a blank page, a name that changes spelling, or a timeline that contradicts itself."
  },
  {
    id: "pass2",
    title: "Pass 2 — Clarity & causal logic",
    sub: "Make sure every sentence produces one clear picture, and every beat earns the next.",
    sections: [
      {
        label: "Sentence-level clarity sweep — high",
        items: [
          { id:"p2-modifiers", text:"Dangling/misattached modifiers fixed (e.g. \"Approaching the horse, Riven instantly nodded…\")", tag:"high" },
          { id:"p2-pronouns", text:"Ambiguous pronoun references resolved", tag:"high" },
          { id:"p2-anatomy", text:'Anatomically unclear language fixed ("eyelids disappeared behind his eyeballs," "shuttered"→"shuddered," "gagged," "soak of blood")', tag:"high" },
          { id:"p2-abstract", text:'Abstract verbs replaced with concrete images ("space to breach," "reoriented her chin," "shadow compiled")', tag:"high" },
          { id:"p2-agreement", text:'Agreement errors fixed ("like a swords ready for combat")', tag:"high" }
        ]
      },
      {
        label: "Highest-impact weak passages — high",
        items: [
          { id:"p2-throne-clarity", text:"Throne Room lines re-checked for clarity after Pass 1 fix", tag:"high" },
          { id:"p2-surveillance", text:"Rían's first surveillance chapter — pressure/resistance/introspection beats written in fully", tag:"high" },
          { id:"p2-bear-approach", text:"Maeren's first approach to the Bear — physical transition restored", tag:"high" },
          { id:"p2-market", text:"Market/village transition — spatial and psychic continuity restored", tag:"high" },
          { id:"p2-portal", text:"Portal confrontation / final transformation — verbs and metaphor sequence clarified (highest-value fix in the book)", tag:"critical" },
          { id:"p2-laststand", text:"Bear's last stand — spatial orientation tightened, figurative language reduced", tag:"high" }
        ]
      },
      {
        label: "Climax causality check — high",
        items: [
          { id:"p2-chain", text:"Full causal chain reads cleanly end to end (rain barrier → Elder response → investigation → family truth → betrayal → escape attempt → interception → forced power → moonstone removal → transformation)", tag:"high" },
          { id:"p2-agency", text:"Confirmed Maeren's choice to use force reads as conscious, distinct from the uncontrolled outcome", tag:"high" },
          { id:"p2-override", text:"Confirmed Rían's intervention doesn't read as overriding Maeren's agency", tag:"high" }
        ]
      }
    ],
    note: "Exit criteria: a reader could sketch a simple diagram of who's where and what just happened in every major action/magic sequence without rereading."
  },
  {
    id: "pass3",
    title: "Pass 3 — Emotional & textural polish",
    sub: "Say each true thing once, in its strongest form.",
    sections: [
      {
        label: "The one-question test — high",
        items: [
          { id:"p3-elders", text:"Confronting the Elders — fire/heat imagery reduced to one clear escalation", tag:"high" },
          { id:"p3-betrayal", text:"Betrayal revelation — channels reduced from nine to the strongest few", tag:"high" },
          { id:"p3-portal-metaphor", text:"Portal confrontation — competing metaphor families (fire/ice/stone/blood) reduced to one dominant system", tag:"high" },
          { id:"p3-bird", text:"Rían's bird/cage metaphor — second, longer version cut or shortened so it doesn't re-perform the first", tag:"high" },
          { id:"p3-mourning", text:"Nyara's forest mourning — emotional labels reduced to one register", tag:"high" }
        ]
      },
      {
        label: "Somatic vocabulary audit — medium-high",
        items: [
          { id:"p3-eyes", text:"Eyes/looked — reduced to beats where a look changes power or withholds speech (~436/326 uses)", tag:"medium" },
          { id:"p3-chest", text:"Chest/heart/gut/stomach — differentiated by character and emotion (~230 combined uses)", tag:"medium" },
          { id:"p3-breath", text:"Breath/breathing — kept only where fear/exertion/restraint make it meaningful (120 uses)", tag:"medium" },
          { id:"p3-blood", text:'Blood — metaphorical uses ("blood boiling") checked against fire-imagery overlap (92 uses)', tag:"medium" },
          { id:"p3-nod", text:"Nodded/shook head — dialogue choreography varied (86/77 uses)", tag:"medium" },
          { id:"p3-asif", text:'"As if" comparisons — kept only where they add a new image (~110 uses)', tag:"medium" },
          { id:"p3-started", text:'"Started to" / "Seemed to" / "Began to" — cut where the direct action is already visible (~62/56/34 uses)', tag:"medium" }
        ]
      },
      {
        label: "Filtering pass — medium",
        items: [
          { id:"p3-filter", text:'"Could see / could feel / felt / noticed / realized / watched" audited — kept only where perception itself is the point', tag:"medium" }
        ]
      },
      {
        label: "Dialogue mechanics — medium",
        items: [
          { id:"p3-punct", text:"Dialogue tag punctuation/capitalization inconsistencies fixed", tag:"medium" },
          { id:"p3-tagbeat", text:"Redundant tag + somatic beat + dialogue combinations trimmed to one", tag:"medium" },
          { id:"p3-expo", text:"Expository dialogue (Kēlē, Orlíen, Gwyrionez, Rían, Cordova) rechecked for individual speech rhythm", tag:"medium" }
        ]
      },
      {
        label: "Final protective read — do last",
        items: [
          { id:"p3-nature", text:"Nature as sentient/responsive still intact", tag:"last" },
          { id:"p3-animals", text:"Animal specificity (Riven, Ursa, the Bear) still intact", tag:"last" },
          { id:"p3-hydrangea", text:"Hydrangea symbolism still intact", tag:"last" },
          { id:"p3-rain", text:"Rain-as-freedom motif still intact", tag:"last" },
          { id:"p3-magic", text:"Magic still reads as ecological/perceptual, not technical", tag:"last" },
          { id:"p3-staccato", text:"Staccato rhythm in terror/violence preserved (prologue is the benchmark)", tag:"last" },
          { id:"p3-observational", text:"Maeren's observational filtering preserved where perception matters", tag:"last" },
          { id:"p3-gestures", text:"Small physical gestures carrying grief preserved (Aurelian's poppy is the benchmark)", tag:"last" },
          { id:"p3-juxtaposition", text:"Beauty/violence juxtaposition preserved", tag:"last" },
          { id:"p3-fragments", text:"Fragments for dreams, names, prophecy, self-condemnation preserved", tag:"last" }
        ]
      }
    ],
    note: "Exit criteria: reading each major emotional beat aloud, nothing repeats itself in three different vocabularies, and the ten identity markers above are still intact."
  }
];

const STORAGE_KEY = "bear-guardian-revision-state";
let checked = {};
let notes = {};
let noteSaveTimers = {};

function escapeHtml(str){
  return String(str)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");
}

function tagLabel(tag){
  if(tag==="critical") return "Critical";
  if(tag==="high") return "High";
  if(tag==="medium") return "Medium";
  return "Do last";
}

function allItems(){
  const out = [];
  DATA.forEach(pass => pass.sections.forEach(sec => sec.items.forEach(it => out.push(it))));
  return out;
}

function render(){
  const passList = document.getElementById("passList");
  passList.innerHTML = "";
  DATA.forEach((pass, idx) => {
    const items = pass.sections.flatMap(s => s.items);
    const doneCount = items.filter(it => checked[it.id]).length;
    const pct = items.length ? Math.round((doneCount/items.length)*100) : 0;

    const details = document.createElement("details");
    details.className = "pass";
    if(idx === 0) details.open = true;

    const summary = document.createElement("summary");
    summary.innerHTML = `
      <span class="chev">&#9656;</span>
      <span class="pass-title">${pass.title}<span class="pass-sub">${pass.sub}</span></span>
      <span class="pass-progress">
        <span class="bar"><span class="bar-fill" style="width:${pct}%"></span></span>
        ${doneCount}/${items.length}
      </span>
    `;
    details.appendChild(summary);

    pass.sections.forEach(sec => {
      const label = document.createElement("div");
      label.className = "section-label";
      label.textContent = sec.label;
      details.appendChild(label);

      sec.items.forEach(it => {
        const hasNote = !!(notes[it.id] && notes[it.id].trim());
        const row = document.createElement("div");
        row.className = "item" + (checked[it.id] ? " done" : "");
        row.innerHTML = `
          <input type="checkbox" id="chk-${it.id}" ${checked[it.id] ? "checked" : ""}>
          <div class="item-body">
            <div class="item-row">
              <label for="chk-${it.id}" class="item-text">${it.text}<span class="badge ${it.tag}">${tagLabel(it.tag)}</span></label>
              <button type="button" class="note-toggle${hasNote ? " has-note" : ""}" data-id="${it.id}">${hasNote ? "Edit note" : "+ Note"}</button>
            </div>
            ${it.loc ? `<div class="item-loc">${it.loc}</div>` : ""}
            <textarea class="note-input${hasNote ? " open" : ""}" data-id="${it.id}" placeholder="Add a note…">${escapeHtml(notes[it.id] || "")}</textarea>
            <div class="note-saved" data-id="${it.id}">Saved</div>
          </div>
        `;
        const cb = row.querySelector("input");
        cb.addEventListener("change", () => {
          checked[it.id] = cb.checked;
          row.classList.toggle("done", cb.checked);
          save();
          renderProgressOnly();
        });

        const noteToggle = row.querySelector(".note-toggle");
        const noteInput = row.querySelector(".note-input");
        noteToggle.addEventListener("click", () => {
          const isOpen = noteInput.classList.toggle("open");
          if(isOpen) noteInput.focus();
        });
        noteInput.addEventListener("input", () => {
          const id = it.id;
          notes[id] = noteInput.value;
          const hasText = !!noteInput.value.trim();
          noteToggle.classList.toggle("has-note", hasText);
          noteToggle.textContent = hasText ? "Edit note" : "+ Note";
          clearTimeout(noteSaveTimers[id]);
          noteSaveTimers[id] = setTimeout(async () => {
            await save();
            const savedTag = row.querySelector(`.note-saved[data-id="${id}"]`);
            savedTag.classList.add("show");
            setTimeout(() => savedTag.classList.remove("show"), 1200);
          }, 500);
        });

        details.appendChild(row);
      });
    });

    const note = document.createElement("div");
    note.className = "note";
    note.innerHTML = `<strong>Exit criteria:</strong> ${pass.note}`;
    details.appendChild(note);

    passList.appendChild(details);
  });

  renderProgressOnly();
}

function renderProgressOnly(){
  const items = allItems();
  const done = items.filter(it => checked[it.id]).length;
  const pct = items.length ? Math.round((done/items.length)*100) : 0;
  document.getElementById("overallRing").style.setProperty("--pct", pct);
  document.getElementById("overallPct").textContent = pct + "%";
  document.getElementById("overallText").innerHTML = `<strong>${done} of ${items.length}</strong> items complete`;

  document.querySelectorAll("details.pass").forEach((el, idx) => {
    const pass = DATA[idx];
    const items = pass.sections.flatMap(s => s.items);
    const doneCount = items.filter(it => checked[it.id]).length;
    const pct = items.length ? Math.round((doneCount/items.length)*100) : 0;
    el.querySelector(".bar-fill").style.width = pct + "%";
    el.querySelector(".pass-progress").lastChild.textContent = ` ${doneCount}/${items.length}`;
  });
}

async function save(){
  try{
    await window.storage.set(STORAGE_KEY, JSON.stringify({ checked, notes }), false);
  }catch(e){
    // storage unavailable; progress stays in memory for this session
  }
}

async function load(){
  try{
    const res = await window.storage.get(STORAGE_KEY, false);
    if(res && res.value){
      const parsed = JSON.parse(res.value);
      if(parsed && (parsed.checked || parsed.notes)){
        checked = parsed.checked || {};
        notes = parsed.notes || {};
      }else{
        // legacy format: raw checked map with no notes
        checked = parsed || {};
        notes = {};
      }
    }
  }catch(e){
    checked = {};
    notes = {};
  }
  render();
}

function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 1600);
}

document.getElementById("expandAll").addEventListener("click", () => {
  document.querySelectorAll("details.pass").forEach(d => d.open = true);
});
document.getElementById("collapseAll").addEventListener("click", () => {
  document.querySelectorAll("details.pass").forEach(d => d.open = false);
});
document.getElementById("resetAll").addEventListener("click", async () => {
  if(!confirm("Reset all checked items and notes? This can't be undone.")) return;
  checked = {};
  notes = {};
  await save();
  render();
  showToast("Progress reset");
});

load();
</script>
</body>
</html>
