<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>The Bear Guardian Codex</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
:root{
  --ink:#2a2013;
  --ink-soft:#4a3f2c;
  --parchment:#f3e9d2;
  --parchment-2:#ebdcb6;
  --parchment-3:#e1cf9e;
  --forest-950:#0e1a15;
  --forest-900:#132720;
  --forest-800:#1c352a;
  --forest-700:#2a4a38;
  --forest-600:#3a624a;
  --gold:#c9a24a;
  --gold-bright:#e6c777;
  --rust:#a2503c;
  --muted:#8ba193;
  --sans-display:'Cinzel',serif;
  --serif-body:'EB Garamond',serif;
  --mono:'IBM Plex Mono',monospace;
  --radius:3px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--forest-950);
  color:var(--parchment);
  font-family:var(--serif-body);
  font-size:16px;
  height:100vh;
  overflow:hidden;
}
#root{height:100vh;}
::selection{background:var(--gold);color:var(--forest-950);}
a{color:var(--gold-bright);text-decoration:none;cursor:pointer;}
a:hover{text-decoration:underline;}
button{font-family:var(--serif-body);cursor:pointer;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--forest-700);border-radius:5px;}

.app-shell{
  display:grid;
  grid-template-columns:240px 1fr;
  grid-template-rows:64px 1fr;
  grid-template-areas:"sidebar topbar" "sidebar main";
  height:100vh;
}
@media (max-width:820px){
  .app-shell{grid-template-columns:0 1fr;}
  .sidebar{position:fixed;left:0;top:0;bottom:0;width:240px;transform:translateX(-100%);transition:transform .25s ease;z-index:50;}
  .sidebar.open{transform:translateX(0);}
}

/* ---------- Sidebar ---------- */
.sidebar{
  grid-area:sidebar;
  background:linear-gradient(180deg,var(--forest-900),var(--forest-950));
  border-right:1px solid rgba(201,162,74,.18);
  display:flex;flex-direction:column;
  overflow-y:auto;
}
.brand{
  padding:18px 18px 14px;
  border-bottom:1px solid rgba(201,162,74,.14);
}
.brand-title{
  font-family:var(--sans-display);
  font-size:15px;letter-spacing:.06em;
  color:var(--gold-bright);
  line-height:1.35;
}
.brand-sub{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.08em;margin-top:4px;text-transform:uppercase;}
.nav-group{padding:12px 10px;}
.nav-label{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;padding:8px 10px 4px;}
.nav-item{
  display:flex;align-items:center;justify-content:space-between;
  padding:7px 10px;border-radius:var(--radius);
  color:var(--parchment-2);font-size:14px;
  cursor:pointer;
}
.nav-item:hover{background:rgba(201,162,74,.08);}
.nav-item.active{background:rgba(201,162,74,.16);color:var(--gold-bright);}
.nav-item .count{font-family:var(--mono);font-size:10.5px;color:var(--muted);}
.nav-item.active .count{color:var(--gold);}
.sidebar-foot{margin-top:auto;padding:14px 18px;border-top:1px solid rgba(201,162,74,.14);}
.sidebar-foot select{
  width:100%;background:var(--forest-800);color:var(--parchment-2);
  border:1px solid rgba(201,162,74,.25);border-radius:var(--radius);
  font-family:var(--mono);font-size:11px;padding:6px;
}

/* ---------- Topbar ---------- */
.topbar{
  grid-area:topbar;
  background:var(--forest-900);
  border-bottom:1px solid rgba(201,162,74,.16);
  display:flex;align-items:center;gap:14px;
  padding:0 22px;
}
.menu-toggle{display:none;background:none;border:none;color:var(--gold-bright);font-size:20px;}
@media (max-width:820px){.menu-toggle{display:block;}}
.search-wrap{flex:1;max-width:640px;position:relative;}
.search-input{
  width:100%;background:var(--forest-800);
  border:1px solid rgba(201,162,74,.3);
  color:var(--parchment);
  font-family:var(--serif-body);font-size:15px;font-style:italic;
  padding:9px 14px 9px 34px;border-radius:20px;
  transition:box-shadow .2s, border-color .2s;
}
.search-input::placeholder{color:var(--muted);}
.search-input:focus{
  outline:none;border-color:var(--gold);
  box-shadow:0 0 0 3px rgba(201,162,74,.15), 0 0 18px rgba(201,162,74,.25);
}
.search-icon{position:absolute;left:12px;top:9px;color:var(--gold);font-size:13px;}
.search-results{
  position:absolute;top:46px;left:0;right:0;
  background:var(--parchment);color:var(--ink);
  border-radius:var(--radius);box-shadow:0 12px 30px rgba(0,0,0,.45);
  max-height:420px;overflow-y:auto;z-index:40;
}
.search-results .sr-item{padding:9px 14px;border-bottom:1px solid var(--parchment-3);cursor:pointer;}
.search-results .sr-item:hover{background:var(--parchment-2);}
.sr-type{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--rust);}
.sr-title{font-weight:600;}
.sr-snippet{font-size:12.5px;color:var(--ink-soft);font-style:italic;}
.topbar-actions{display:flex;gap:10px;align-items:center;}
.btn{
  border:1px solid rgba(201,162,74,.4);background:transparent;color:var(--gold-bright);
  padding:8px 14px;border-radius:var(--radius);font-size:13.5px;letter-spacing:.02em;
}
.btn:hover{background:rgba(201,162,74,.1);}
.btn-solid{background:var(--gold);color:var(--forest-950);border-color:var(--gold);font-weight:600;}
.btn-solid:hover{background:var(--gold-bright);}
.btn-ghost{border-color:transparent;color:var(--parchment-2);}
.btn-ghost:hover{background:rgba(255,255,255,.06);}
.btn-danger{border-color:rgba(162,80,60,.5);color:#d98a76;}
.btn-danger:hover{background:rgba(162,80,60,.15);}

/* ---------- Main ---------- */
.main{
  grid-area:main;
  overflow-y:auto;
  background:
    radial-gradient(1200px 700px at 15% -10%, rgba(201,162,74,.05), transparent 60%),
    var(--forest-950);
  padding:26px 30px 90px;
}
.page-title{
  font-family:var(--sans-display);font-size:26px;color:var(--parchment);
  letter-spacing:.02em;margin:4px 0 4px;
}
.page-sub{color:var(--muted);font-size:13.5px;font-style:italic;margin-bottom:22px;}
.divider-gold{height:1px;background:linear-gradient(90deg,var(--gold),transparent);margin:14px 0 22px;}

.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin-bottom:8px;}
.stat-card{
  background:var(--forest-900);border:1px solid rgba(201,162,74,.18);border-radius:var(--radius);
  padding:14px 16px;
}
.stat-num{font-family:var(--sans-display);font-size:26px;color:var(--gold-bright);}
.stat-lbl{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:2px;}

.dash-columns{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:22px;}
@media (max-width:1000px){.dash-columns{grid-template-columns:1fr;}}
.panel{background:var(--forest-900);border:1px solid rgba(201,162,74,.16);border-radius:var(--radius);padding:16px 18px;}
.panel h3{font-family:var(--sans-display);font-size:14px;color:var(--gold-bright);letter-spacing:.04em;margin:0 0 10px;text-transform:uppercase;}
.list-row{padding:7px 0;border-bottom:1px solid rgba(255,255,255,.06);font-size:14px;display:flex;justify-content:space-between;gap:10px;}
.list-row:last-child{border-bottom:none;}
.list-row .muted{color:var(--muted);font-size:12px;font-family:var(--mono);}
.empty-note{color:var(--muted);font-style:italic;font-size:13px;padding:8px 0;}

/* ---------- Entry cards / lists ---------- */
.entry-toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:12px;flex-wrap:wrap;}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;}
.entry-card{
  background:var(--parchment);color:var(--ink);border-radius:var(--radius);
  padding:14px 16px;border:1px solid var(--parchment-3);
  cursor:pointer;position:relative;transition:transform .12s, box-shadow .12s;
}
.entry-card:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.35);}
.entry-card .fav{position:absolute;top:10px;right:12px;color:var(--gold);}
.entry-card .et-type{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--rust);}
.entry-card h4{font-family:var(--sans-display);font-size:16px;margin:4px 0 6px;color:var(--ink);}
.entry-card p{font-size:13px;color:var(--ink-soft);margin:0;line-height:1.4;max-height:54px;overflow:hidden;}
.entry-card .tag-row{margin-top:8px;display:flex;gap:5px;flex-wrap:wrap;}
.tag-chip{
  background:var(--forest-700);color:var(--parchment-2);font-family:var(--mono);
  font-size:10px;padding:2px 7px;border-radius:10px;letter-spacing:.03em;
}
.entry-card .tag-chip{background:var(--parchment-3);color:var(--ink-soft);}

/* ---------- Entry Detail ---------- */
.detail-wrap{display:grid;grid-template-columns:1fr 300px;gap:22px;}
@media (max-width:900px){.detail-wrap{grid-template-columns:1fr;}}
.detail-main{background:var(--parchment);color:var(--ink);border-radius:var(--radius);padding:26px 30px;}
.detail-header{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;}
.detail-type{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--rust);}
.detail-title{font-family:var(--sans-display);font-size:28px;color:var(--ink);margin:4px 0 10px;}
.field-block{margin-bottom:16px;}
.field-label{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);opacity:.7;margin-bottom:4px;}
.field-value{font-size:15px;line-height:1.55;white-space:pre-wrap;}
.field-value .wikilink{color:var(--rust);font-weight:600;border-bottom:1px dotted var(--rust);}
.body-text{font-size:15.5px;line-height:1.7;white-space:pre-wrap;}
.body-text .wikilink{color:var(--rust);font-weight:600;border-bottom:1px dotted var(--rust);cursor:pointer;}
.body-text h1,.body-text h2,.body-text h3{font-family:var(--sans-display);margin:14px 0 6px;}
.body-text blockquote{border-left:3px solid var(--gold);margin:8px 0;padding:4px 0 4px 14px;font-style:italic;color:var(--ink-soft);}

.detail-side{display:flex;flex-direction:column;gap:14px;}
.side-panel{background:var(--forest-900);border:1px solid rgba(201,162,74,.16);border-radius:var(--radius);padding:14px 16px;}
.side-panel h4{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);margin:0 0 10px;}
.link-chip{
  display:inline-flex;align-items:center;gap:5px;background:var(--forest-800);
  color:var(--parchment-2);border:1px solid rgba(201,162,74,.25);
  border-radius:12px;padding:4px 10px;font-size:12.5px;margin:0 6px 6px 0;cursor:pointer;
}
.link-chip:hover{border-color:var(--gold);color:var(--gold-bright);}
.link-chip .lc-type{font-family:var(--mono);font-size:9px;color:var(--muted);margin-right:2px;}
.history-row{font-size:12.5px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.05);display:flex;justify-content:space-between;}
.history-row a{font-size:11px;}

/* ---------- Forms / modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(10,16,13,.72);display:flex;align-items:center;justify-content:center;z-index:100;padding:24px;}
.modal{
  background:var(--parchment);color:var(--ink);border-radius:6px;
  width:min(720px,100%);max-height:88vh;overflow-y:auto;
  padding:26px 30px;box-shadow:0 30px 70px rgba(0,0,0,.5);
}
.modal h2{font-family:var(--sans-display);font-size:20px;margin:0 0 16px;}
.form-row{margin-bottom:13px;}
.form-row label{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);opacity:.75;margin-bottom:4px;}
.form-row input, .form-row select, .form-row textarea{
  width:100%;padding:9px 11px;border:1px solid var(--parchment-3);border-radius:var(--radius);
  background:#fbf6e8;color:var(--ink);font-family:var(--serif-body);font-size:14.5px;
}
.form-row textarea{min-height:70px;resize:vertical;font-family:var(--serif-body);}
.form-row input:focus,.form-row select:focus,.form-row textarea:focus{outline:2px solid var(--gold);}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;border-top:1px solid var(--parchment-3);padding-top:16px;}
.chip-input-wrap{display:flex;flex-wrap:wrap;gap:6px;border:1px solid var(--parchment-3);border-radius:var(--radius);padding:6px;background:#fbf6e8;}
.chip-input-wrap input{border:none;flex:1;min-width:80px;padding:4px;background:transparent;}
.chip-remove{cursor:pointer;color:var(--rust);margin-left:4px;font-weight:700;}
.autocomplete-list{position:relative;}
.ac-menu{position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid var(--parchment-3);z-index:10;max-height:180px;overflow-y:auto;border-radius:0 0 4px 4px;}
.ac-menu div{padding:7px 10px;font-size:13px;cursor:pointer;}
.ac-menu div:hover{background:var(--parchment-2);}

/* ---------- Capture button ---------- */
.capture-btn{
  position:fixed;bottom:26px;right:28px;z-index:60;
  background:var(--gold);color:var(--forest-950);border:none;
  padding:13px 20px;border-radius:24px;font-family:var(--sans-display);
  font-size:13px;letter-spacing:.04em;box-shadow:0 10px 26px rgba(0,0,0,.4);
  display:flex;align-items:center;gap:8px;
}
.capture-btn:hover{background:var(--gold-bright);transform:translateY(-1px);}

/* ---------- AI assistant panel ---------- */
.ai-panel{
  position:fixed;top:0;right:0;bottom:0;width:380px;background:var(--forest-900);
  border-left:1px solid rgba(201,162,74,.25);z-index:90;display:flex;flex-direction:column;
  transform:translateX(100%);transition:transform .25s ease;
}
.ai-panel.open{transform:translateX(0);}
.ai-header{padding:16px 18px;border-bottom:1px solid rgba(201,162,74,.16);display:flex;justify-content:space-between;align-items:center;}
.ai-header h3{font-family:var(--sans-display);color:var(--gold-bright);font-size:15px;margin:0;}
.ai-body{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:12px;}
.ai-msg{font-size:13.5px;line-height:1.5;padding:9px 12px;border-radius:8px;max-width:92%;}
.ai-msg.user{background:var(--forest-700);align-self:flex-end;color:var(--parchment);}
.ai-msg.assistant{background:var(--parchment);color:var(--ink);align-self:flex-start;}
.ai-input-row{padding:12px 14px;border-top:1px solid rgba(201,162,74,.16);display:flex;gap:8px;}
.ai-input-row textarea{flex:1;background:var(--forest-800);border:1px solid rgba(201,162,74,.3);color:var(--parchment);border-radius:6px;padding:8px 10px;font-family:var(--serif-body);font-size:13.5px;resize:none;min-height:40px;}

/* ---------- Graph ---------- */
.graph-wrap{background:var(--forest-900);border:1px solid rgba(201,162,74,.16);border-radius:var(--radius);height:70vh;position:relative;overflow:hidden;}
.graph-hint{position:absolute;top:10px;left:14px;font-family:var(--mono);font-size:11px;color:var(--muted);z-index:5;}
.graph-legend{position:absolute;bottom:12px;left:14px;font-family:var(--mono);font-size:10.5px;color:var(--muted);z-index:5;}

/* ---------- Timeline ---------- */
.tl-track{position:relative;padding-left:26px;border-left:2px solid rgba(201,162,74,.3);margin-top:10px;}
.tl-item{position:relative;padding:0 0 26px 20px;}
.tl-item::before{content:'';position:absolute;left:-31px;top:2px;width:11px;height:11px;border-radius:50%;background:var(--gold);border:2px solid var(--forest-950);}
.tl-date{font-family:var(--mono);font-size:11px;color:var(--gold);}
.tl-title{font-family:var(--sans-display);font-size:16px;color:var(--parchment);margin:2px 0 4px;}
.tl-desc{font-size:13.5px;color:var(--muted);}

/* misc */
.badge-imp-Pivotal{color:var(--rust);font-weight:700;}
.badge-imp-High{color:var(--gold-bright);}
.toast{position:fixed;bottom:26px;left:28px;background:var(--forest-800);border:1px solid var(--gold);color:var(--parchment);padding:10px 16px;border-radius:6px;font-size:13px;z-index:200;}
</style>
</head>
<body>
<div id="root"></div>
<script>
/* =========================================================
   THE BEAR GUARDIAN CODEX — data model + entry types
   ========================================================= */
const ENTRY_TYPES = {
  character:{label:'Character',fields:[
    {k:'image',l:'Portrait',t:'image'},
    {k:'summary',l:'Summary',t:'textarea'},
    {k:'arc',l:'Arc',t:'textarea'},
    {k:'internalConflict',l:'Internal Conflict',t:'textarea'},
    {k:'externalConflict',l:'External Conflict',t:'textarea'},
    {k:'symbolism',l:'Symbolism',t:'text'},
    {k:'representativeTheme',l:'Representative Theme',t:'text'},
    {k:'representativeForce',l:'Representative Force',t:'text'},
    {k:'status',l:'Status',t:'select',opts:['Alive','Deceased','Unknown','Transformed']},
  ]},
  scene:{label:'Scene',fields:[
    {k:'book',l:'Book',t:'text'},{k:'chapter',l:'Chapter',t:'text'},{k:'pov',l:'POV Character',t:'text'},
    {k:'summary',l:'Summary',t:'textarea'},{k:'purpose',l:'Purpose',t:'textarea'},
    {k:'emotionalGoal',l:'Emotional Goal',t:'text'},{k:'characterDevelopment',l:'Character Development',t:'textarea'},
    {k:'theme',l:'Theme',t:'text'},{k:'foreshadowing',l:'Foreshadowing',t:'textarea'},{k:'payoffs',l:'Payoffs',t:'textarea'},
    {k:'status',l:'Status',t:'select',opts:['Idea','Drafted','Revised','Final']},
  ]},
  theme:{label:'Theme',fields:[{k:'description',l:'Description',t:'textarea'}]},
  symbol:{label:'Symbol',fields:[{k:'meaning',l:'Meaning',t:'textarea'},{k:'appearances',l:'Appearances',t:'textarea'}]},
  location:{label:'Location',fields:[{k:'image',l:'Image',t:'image'},{k:'description',l:'Description',t:'textarea'},{k:'kingdom',l:'Kingdom / Region',t:'text'},{k:'significance',l:'Significance',t:'textarea'}]},
  magic:{label:'Magic System',fields:[{k:'description',l:'Description',t:'textarea'},{k:'rules',l:'Rules',t:'textarea'},{k:'cost',l:'Cost / Price',t:'textarea'}]},
  creature:{label:'Creature',fields:[{k:'description',l:'Description',t:'textarea'},{k:'habitat',l:'Habitat',t:'text'},{k:'abilities',l:'Abilities',t:'textarea'}]},
  bloodline:{label:'Bloodline',fields:[{k:'description',l:'Description',t:'textarea'},{k:'members',l:'Notable Members',t:'textarea'},{k:'traits',l:'Traits',t:'textarea'}]},
  prophecy:{label:'Prophecy',fields:[{k:'text',l:'Prophecy Text',t:'textarea'},{k:'origin',l:'Origin',t:'text'},{k:'fulfillment',l:'Fulfillment Status',t:'select',opts:['Unfulfilled','Partially Fulfilled','Fulfilled','Subverted']}]},
  historicalEvent:{label:'Historical Event',fields:[{k:'era',l:'Era',t:'text'},{k:'order',l:'Sort Order (#)',t:'text'},{k:'description',l:'Description',t:'textarea'},{k:'consequences',l:'Consequences',t:'textarea'}]},
  relationship:{label:'Relationship',fields:[{k:'entryA',l:'Character A',t:'text'},{k:'entryB',l:'Character B',t:'text'},{k:'natureOf',l:'Nature of Relationship',t:'text'},{k:'evolution',l:'Evolution',t:'textarea'}]},
  timelineEvent:{label:'Timeline Event',fields:[{k:'date',l:'Date / Era',t:'text'},{k:'order',l:'Sort Order (#)',t:'text'},{k:'book',l:'Book',t:'text'},{k:'kingdom',l:'Kingdom',t:'text'},{k:'character',l:'Character',t:'text'},{k:'description',l:'Description',t:'textarea'}]},
  discovery:{label:'Discovery',fields:[{k:'date',l:'Date',t:'text'},{k:'description',l:'Description',t:'textarea'},{k:'importance',l:'Importance',t:'select',opts:['Low','Medium','High','Pivotal']}]},
  question:{label:'Open Question',fields:[{k:'question',l:'Question',t:'textarea'},{k:'status',l:'Status',t:'select',opts:['Open','Resolved']}]},
  looseIdea:{label:'Loose Idea',fields:[{k:'idea',l:'Idea',t:'textarea'}]},
  quote:{label:'Quote',fields:[{k:'text',l:'Quote Text',t:'textarea'},{k:'speaker',l:'Speaker',t:'text'},{k:'context',l:'Context',t:'text'}]},
  custom:{label:'Custom',fields:[{k:'description',l:'Description',t:'textarea'}]},
};
const TYPE_ORDER = ['character','scene','theme','symbol','location','magic','creature','bloodline','prophecy','historicalEvent','relationship','timelineEvent','discovery','question','looseIdea','quote','custom'];

function uid(){return 'e'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
function nowISO(){return new Date().toISOString();}

/* =========================================================
   DATA LAYER — talks to the Express + SQLite/Turso backend
   (see server.js / db.js). No client-side persistence tricks
   needed anymore: every save is a real database write.
   ========================================================= */
async function apiGet(url){
  const res = await fetch(url);
  if(!res.ok){ const e = await res.json().catch(()=>({})); throw new Error(e.error||('Request failed: '+res.status)); }
  return res.json();
}
async function apiSend(url, method, body){
  const res = await fetch(url, {method, headers:{'Content-Type':'application/json'}, body: body?JSON.stringify(body):undefined});
  if(!res.ok){ const e = await res.json().catch(()=>({})); throw new Error(e.error||('Request failed: '+res.status)); }
  return res.json();
}

/* =========================================================
   MARKDOWN-LITE + WIKILINK RENDERER
   ========================================================= */
function escapeHtml(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function renderRich(text){
  if(!text) return '';
  let lines = escapeHtml(text).split('\n');
  let html='', inQuote=false, listOpen=false;
  for(let line of lines){
    if(line.startsWith('&gt; ')){ if(!inQuote){html+='<blockquote>';inQuote=true;} html+=line.slice(5)+'<br/>'; continue; }
    else if(inQuote){ html+='</blockquote>'; inQuote=false; }
    if(/^###\s+/.test(line)){ html+='<h3>'+line.replace(/^###\s+/,'')+'</h3>'; continue; }
    if(/^##\s+/.test(line)){ html+='<h2>'+line.replace(/^##\s+/,'')+'</h2>'; continue; }
    if(/^#\s+/.test(line)){ html+='<h1>'+line.replace(/^#\s+/,'')+'</h1>'; continue; }
    if(/^-\s+/.test(line)){ if(!listOpen){html+='<ul>';listOpen=true;} html+='<li>'+line.replace(/^-\s+/,'')+'</li>'; continue; }
    else if(listOpen){ html+='</ul>'; listOpen=false; }
    line = line.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>');
    line = line.replace(/\[\[([^\]]+)\]\]/g,(m,t)=>{
      const found = App.index.find(s=>s.title.toLowerCase()===t.trim().toLowerCase());
      return '<span class="wikilink" data-nav="'+(found?found.id:'')+'" data-title="'+escapeHtml(t.trim())+'">'+escapeHtml(t.trim())+'</span>';
    });
    html+= (line.trim()? '<p>'+line+'</p>' : '<br/>');
  }
  if(inQuote) html+='</blockquote>';
  if(listOpen) html+='</ul>';
  return html;
}

function renderGraph(){
  const svgEl = document.getElementById('graphSvg');
  if(!svgEl || typeof d3==='undefined') return;
  const width = svgEl.parentElement.clientWidth, height = svgEl.parentElement.clientHeight;
  const nodes = filteredIndex().map(s=>({id:s.id,title:s.title,type:s.type}));
  const nodeIds = new Set(nodes.map(n=>n.id));
  const links = [];
  filteredIndex().forEach(s=> (s.links||[]).forEach(l=>{ if(nodeIds.has(l)) links.push({source:s.id,target:l}); }));
  const svg = d3.select(svgEl).attr('viewBox',[0,0,width,height]);
  svg.selectAll('*').remove();
  const g = svg.append('g');
  svg.call(d3.zoom().scaleExtent([0.3,3]).on('zoom', (ev)=> g.attr('transform', ev.transform)));
  const sim = d3.forceSimulation(nodes)
    .force('link', d3.forceLink(links).id(d=>d.id).distance(90).strength(0.6))
    .force('charge', d3.forceManyBody().strength(-160))
    .force('center', d3.forceCenter(width/2, height/2))
    .force('collide', d3.forceCollide(28));
  const link = g.append('g').selectAll('line').data(links).join('line')
    .attr('stroke','#c9a24a').attr('stroke-opacity',0.35).attr('stroke-width',1.2);
  const node = g.append('g').selectAll('g').data(nodes).join('g').style('cursor','pointer')
    .call(d3.drag()
      .on('start',(ev,d)=>{ if(!ev.active) sim.alphaTarget(0.3).restart(); d.fx=d.x; d.fy=d.y; })
      .on('drag',(ev,d)=>{ d.fx=ev.x; d.fy=ev.y; })
      .on('end',(ev,d)=>{ if(!ev.active) sim.alphaTarget(0); d.fx=null; d.fy=null; }));
  node.append('circle').attr('r',10).attr('fill','#1c352a').attr('stroke','#c9a24a').attr('stroke-width',1.6);
  node.append('text').text(d=>d.title).attr('x',14).attr('y',4).attr('fill','#f3e9d2')
    .attr('font-family','EB Garamond, serif').attr('font-size',12);
  node.on('click',(ev,d)=>{
    const neigh = new Set(links.filter(l=>l.source.id===d.id||l.target.id===d.id).flatMap(l=>[l.source.id,l.target.id]));
    node.select('circle').attr('fill', n=> n.id===d.id? '#c9a24a' : neigh.has(n.id)? '#3a624a' : '#1c352a')
      .attr('stroke', n=> neigh.has(n.id)||n.id===d.id? '#e6c777':'#c9a24a');
    link.attr('stroke-opacity', l=> l.source.id===d.id||l.target.id===d.id? 0.9:0.12)
      .attr('stroke', l=> l.source.id===d.id||l.target.id===d.id? '#e6c777':'#c9a24a');
  });
  node.on('dblclick',(ev,d)=>{ nav('detail', d.id); });
  sim.on('tick',()=>{
    link.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y).attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);
    node.attr('transform',d=>`translate(${d.x},${d.y})`);
  });
}

/* =========================================================
   MODAL: create / edit entry
   ========================================================= */
function fieldInput(f, value){
  value = value==null? '' : value;
  if(f.t==='select') return `<select name="${f.k}"><option value="">—</option>${f.opts.map(o=>`<option value="${o}" ${value===o?'selected':''}>${o}</option>`).join('')}</select>`;
  if(f.t==='textarea') return `<textarea name="${f.k}" placeholder="Use [[Entry Title]] to link.">${escapeHtml(value)}</textarea>`;
  if(f.t==='image'){
    const fid = 'imgfield_'+f.k+'_'+Math.random().toString(36).slice(2,8);
    return `
      <div class="image-field">
        <input type="hidden" name="${f.k}" id="${fid}_hidden" value="${escapeHtml(value)}"/>
        <img id="${fid}_preview" src="${value||''}" style="max-width:200px;max-height:200px;border-radius:8px;border:1px solid var(--gold);margin-bottom:8px;display:${value?'block':'none'};"/>
        <input type="file" accept="image/*" onchange="handleImageFile(event,'${fid}')"/>
        <button type="button" class="btn btn-ghost" style="margin-top:6px;${value?'':'display:none;'}" id="${fid}_clear" onclick="clearImageField('${fid}')">Remove Image</button>
      </div>`;
  }
  return `<input type="text" name="${f.k}" value="${escapeHtml(value)}"/>`;
}
function handleImageFile(evt, fid){
  const file = evt.target.files && evt.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    const img = new Image();
    img.onload = function(){
      const maxDim = 900;
      let w = img.width, h = img.height;
      if(w>maxDim || h>maxDim){
        if(w>=h){ h = Math.round(h*maxDim/w); w = maxDim; }
        else { w = Math.round(w*maxDim/h); h = maxDim; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.82);
      const hidden = document.getElementById(fid+'_hidden');
      const preview = document.getElementById(fid+'_preview');
      const clearBtn = document.getElementById(fid+'_clear');
      if(hidden) hidden.value = dataUrl;
      if(preview){ preview.src = dataUrl; preview.style.display='block'; }
      if(clearBtn) clearBtn.style.display='inline-block';
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}
function clearImageField(fid){
  const hidden = document.getElementById(fid+'_hidden');
  const preview = document.getElementById(fid+'_preview');
  const clearBtn = document.getElementById(fid+'_clear');
  if(hidden) hidden.value='';
  if(preview){ preview.src=''; preview.style.display='none'; }
  if(clearBtn) clearBtn.style.display='none';
}
async function openEditModal(type, id){
  const isNew = !id;
  const entry = isNew? {id:uid(),type,fields:{},tags:[],links:[],series:App.seriesFilter==='All'?'Series 1':App.seriesFilter,favorite:false,title:'',body:''} : await getFullEntry(id);
  const typeDef = ENTRY_TYPES[entry.type];
  const overlay = document.createElement('div');
  overlay.className='overlay';
  overlay.innerHTML = `
    <div class="modal">
      <h2>${isNew? 'New '+typeDef.label : 'Edit '+escapeHtml(entry.title)}</h2>
      <form id="entryForm">
        <div class="form-row"><label>Title</label><input type="text" name="title" value="${escapeHtml(entry.title||'')}" required/></div>
        <div class="two-col">
          <div class="form-row"><label>Series / Book</label><input type="text" name="series" value="${escapeHtml(entry.series||'Series 1')}"/></div>
          <div class="form-row"><label>Tags (comma separated)</label><input type="text" name="tagsRaw" value="${escapeHtml((entry.tags||[]).join(', '))}"/></div>
        </div>
        ${typeDef.fields.map(f=>`<div class="form-row"><label>${f.l}</label>${fieldInput(f, entry.fields?entry.fields[f.k]:'')}</div>`).join('')}
        <div class="form-row"><label>Notes (supports [[links]], **bold**, *italic*, # headings, - lists, &gt; quotes)</label>
          <textarea name="body" style="min-height:110px;">${escapeHtml(entry.body||'')}</textarea></div>
        <div class="form-row"><label><input type="checkbox" name="favorite" ${entry.favorite?'checked':''} style="width:auto;margin-right:6px;"/>Mark as favorite</label></div>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" id="cancelModal">Cancel</button>
          <button type="submit" class="btn btn-solid">Save Entry</button>
        </div>
      </form>
    </div>`;
  document.body.appendChild(overlay);
  overlay.querySelector('#cancelModal').onclick=()=>overlay.remove();
  overlay.addEventListener('click',(e)=>{ if(e.target===overlay) overlay.remove(); });
  overlay.querySelector('#entryForm').onsubmit = async (e)=>{
    e.preventDefault();
    const submitBtn = e.target.querySelector('button[type="submit"]');
    submitBtn.disabled = true; submitBtn.textContent = 'Saving…';
    try{
      const fd = new FormData(e.target);
      const title = (fd.get('title')||'').trim();
      if(!title){ showToast('Please give this entry a title.'); submitBtn.disabled=false; submitBtn.textContent='Save Entry'; return; }
      const newEntry = {...entry};
      newEntry.title = title;
      newEntry.series = (fd.get('series')||'').trim()||'Series 1';
      newEntry.tags = (fd.get('tagsRaw')||'').split(',').map(t=>t.trim()).filter(Boolean);
      newEntry.body = fd.get('body')||'';
      newEntry.favorite = fd.get('favorite')==='on';
      newEntry.fields = {};
      typeDef.fields.forEach(f=> newEntry.fields[f.k]=fd.get(f.k)||'');
      delete newEntry.isStub;
      await saveEntry(newEntry, isNew);
      overlay.remove();
      nav('detail', newEntry.id);
    }catch(err){
      console.error('Save failed:', err);
      showToast('Save failed: '+(err && err.message ? err.message : 'unknown error'));
      submitBtn.disabled = false; submitBtn.textContent = 'Save Entry';
    }
  };
}

function openCaptureModal(){
  const overlay = document.createElement('div');
  overlay.className='overlay';
  overlay.innerHTML = `
    <div class="modal" style="max-width:520px;">
      <h2>Capture Idea</h2>
      <form id="captureForm">
        <div class="form-row"><textarea name="idea" autofocus placeholder="Dump the thought now. Organize it later." style="min-height:140px;"></textarea></div>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" id="cancelCapture">Cancel</button>
          <button type="submit" class="btn btn-solid">Save to Loose Ideas</button>
        </div>
      </form>
    </div>`;
  document.body.appendChild(overlay);
  overlay.querySelector('#cancelCapture').onclick=()=>overlay.remove();
  overlay.addEventListener('click',(e)=>{ if(e.target===overlay) overlay.remove(); });
  overlay.querySelector('#captureForm').onsubmit = async (e)=>{
    e.preventDefault();
    const text = (new FormData(e.target).get('idea')||'').trim();
    if(!text){ overlay.remove(); return; }
    try{
      const title = text.split('\n')[0].slice(0,60) || 'Untitled capture';
      const entry = {id:uid(),type:'looseIdea',title,fields:{idea:text},body:'',tags:['capture'],
        series:App.seriesFilter==='All'?'Series 1':App.seriesFilter,favorite:false,links:[]};
      await saveEntry(entry, true);
      overlay.remove();
      showToast('Idea captured.');
      render();
    }catch(err){
      console.error('Capture failed:', err);
      showToast('Capture failed: '+(err && err.message ? err.message : 'unknown error'));
    }
  };

function showToast(msg){
  const t = document.createElement('div'); t.className='toast'; t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),2200);
}

/* =========================================================
   AI ASSISTANT PANEL
   ========================================================= */
function buildCodexContext(question){
  const q = question.toLowerCase();
  const words = q.split(/\W+/).filter(w=>w.length>2);
  const scored = App.index.map(s=>{
    let score=0;
    const hay = (s.title+' '+(s.tags||[]).join(' ')+' '+(s.snippet||'')).toLowerCase();
    words.forEach(w=>{ if(hay.includes(w)) score++; });
    return {s,score};
  }).sort((a,b)=>b.score-a.score);
  const top = scored.filter(x=>x.score>0).slice(0,12).map(x=>x.s);
  const pool = top.length? top : App.index.slice(0,12);
  let ctx = 'You are the AI assistant embedded in a fiction writer\'s worldbuilding database called The Bear Guardian Codex. Answer only from the context entries below. If the answer is not present, say so plainly rather than inventing details.\n\nCODEX ENTRIES:\n';
  pool.forEach(s=>{
    ctx += `- [${s.type}] "${s.title}" — tags: ${(s.tags||[]).join(', ')||'none'}; connects to: ${(s.links||[]).map(id=>{const f=App.index.find(x=>x.id===id);return f?f.title:'';}).filter(Boolean).join(', ')||'none'}; note: ${(s.snippet||'').slice(0,200)}\n`;
  });
  return ctx;
}
async function askAI(question){
  App.aiMessages.push({role:'user',text:question});
  renderAiPanel();
  try{
    const context = buildCodexContext(question);
    const data = await apiSend('/api/ask', 'POST', {question, context});
    App.aiMessages.push({role:'assistant', text: data.text || 'No response.'});
  }catch(err){
    App.aiMessages.push({role:'assistant', text: err.message || 'The assistant could not be reached right now.'});
  }
  renderAiPanel();
}
function renderAiPanel(){
  const panel = document.getElementById('aiPanel');
  if(!panel) return;
  panel.className = 'ai-panel'+(App.aiOpen?' open':'');
  const body = panel.querySelector('.ai-body');
  body.innerHTML = App.aiMessages.length? App.aiMessages.map(m=>`<div class="ai-msg ${m.role}">${escapeHtml(m.text)}</div>`).join('')
    : `<div class="ai-msg assistant">Ask me things like "What scenes involve the moonstone?" or "Which themes does Brynna represent?" — I answer from what's actually in your Codex.</div>`;
  body.scrollTop = body.scrollHeight;
}

/* =========================================================
   MAIN RENDER + EVENT WIRING
   ========================================================= */
async function render(){
  root.innerHTML = `
    <div class="app-shell">
      <div class="sidebar" id="sidebar">${sidebarHtml()}</div>
      <div class="topbar">${topbarHtml()}</div>
      <div class="main" id="mainArea"><div class="empty-note">Loading the Codex…</div></div>
    </div>
    <button class="capture-btn" id="captureBtn">✦ Capture Idea</button>
    <div class="ai-panel" id="aiPanel">
      <div class="ai-header"><h3>Ask the Codex</h3><button class="btn btn-ghost" id="aiClose">✕</button></div>
      <div class="ai-body"></div>
      <div class="ai-input-row"><textarea id="aiInput" placeholder="Ask about the Codex…"></textarea><button class="btn btn-solid" id="aiSend">Ask</button></div>
    </div>
  `;
  renderAiPanel();
  const main = document.getElementById('mainArea');
  if(App.view==='dashboard') main.innerHTML = await dashboardView();
  else if(App.view==='search') main.innerHTML = searchView();
  else if(App.view==='tags') main.innerHTML = tagsView();
  else if(App.view==='discoveries'){ main.innerHTML = discoveriesView(); await renderDiscoveryDetails(); }
  else if(App.view==='timeline'){ main.innerHTML = timelineView(); await renderTimelineTrack('all');
    document.getElementById('tlFilter').onchange = (e)=>renderTimelineTrack(e.target.value); }
  else if(App.view==='graph'){ main.innerHTML = graphView(); requestAnimationFrame(renderGraph); }
  else if(App.view==='list') main.innerHTML = listView(App.viewParam);
  else if(App.view==='detail') main.innerHTML = await detailView(App.viewParam);
  wireEvents();
}

function wireEvents(){
  document.querySelectorAll('[data-nav]').forEach(el=>{
    el.addEventListener('click',(e)=>{
      const v = el.getAttribute('data-nav'); const p = el.getAttribute('data-param');
      if(v==='detail') nav('detail', p||el.getAttribute('data-id'));
      else nav(v, p);
    });
  });
  document.querySelectorAll('[data-tagnav]').forEach(el=>{
    el.addEventListener('click',()=>nav('tags', el.getAttribute('data-tagnav')));
  });
  document.querySelectorAll('[data-newtype]').forEach(el=>{
    el.addEventListener('click',()=>openEditModal(el.getAttribute('data-newtype')));
  });
  const newBtn = document.getElementById('newEntryBtn');
  if(newBtn) newBtn.onclick = ()=> openTypePicker();
  const menuToggle = document.getElementById('menuToggle');
  if(menuToggle) menuToggle.onclick = ()=> document.getElementById('sidebar').classList.toggle('open');
  const seriesSel = document.getElementById('seriesSelect');
  if(seriesSel) seriesSel.onchange = (e)=>{ App.seriesFilter=e.target.value; render(); };
  const captureBtn = document.getElementById('captureBtn');
  if(captureBtn) captureBtn.onclick = openCaptureModal;
  const aiToggle = document.getElementById('aiToggleBtn');
  if(aiToggle) aiToggle.onclick = ()=>{ App.aiOpen=!App.aiOpen; renderAiPanel(); };
  const aiClose = document.getElementById('aiClose');
  if(aiClose) aiClose.onclick = ()=>{ App.aiOpen=false; renderAiPanel(); };
  const aiSend = document.getElementById('aiSend');
  if(aiSend) aiSend.onclick = ()=>{
    const inp = document.getElementById('aiInput'); const q = inp.value.trim();
    if(q){ inp.value=''; askAI(q); }
  };
  const editBtn = document.getElementById('editBtn');
  if(editBtn) editBtn.onclick = ()=> openEditModal(App.cache[App.viewParam].type, App.viewParam);
  const deleteBtn = document.getElementById('deleteBtn');
  if(deleteBtn) deleteBtn.onclick = async ()=>{
    if(confirm('Delete this entry? This cannot be undone.')){ await deleteEntryById(App.viewParam); nav('dashboard'); }
  };
  const favBtn = document.getElementById('favBtn');
  if(favBtn) favBtn.onclick = async ()=>{
    const e = await getFullEntry(App.viewParam); e.favorite=!e.favorite; await saveEntry(e,false); render();
  };
  document.querySelectorAll('[data-restore]').forEach(el=>{
    el.onclick = async ()=>{
      const id = el.getAttribute('data-restore'); const hi = parseInt(el.getAttribute('data-hindex'));
      const entry = await getFullEntry(id); const snap = entry.history[hi].snapshot;
      const restored = {...snap, id:entry.id, history:entry.history};
      await saveEntry(restored, false); showToast('Version restored.'); nav('detail', id);
    };
  });
  document.querySelectorAll('.wikilink').forEach(el=>{
    el.onclick = ()=>{ const id = el.getAttribute('data-nav'); if(id) nav('detail', id); else showToast('"'+el.getAttribute('data-title')+'" has no page yet.'); };
  });
  const searchInput = document.getElementById('globalSearch');
  if(searchInput){
    searchInput.oninput = (e)=>{
      const q = e.target.value; App.searchQuery=q;
      const box = document.getElementById('searchResultsBox');
      if(!q.trim()){ box.innerHTML=''; return; }
      const ql = q.toLowerCase();
      const results = App.index.filter(s=> s.title.toLowerCase().includes(ql) || (s.tags||[]).some(t=>t.toLowerCase().includes(ql)) || (s.snippet||'').toLowerCase().includes(ql)).slice(0,10);
      box.innerHTML = `<div class="search-results">${results.length? results.map(s=>`
        <div class="sr-item" data-nav="detail" data-param="${s.id}">
          <div class="sr-type">${ENTRY_TYPES[s.type]?ENTRY_TYPES[s.type].label:s.type}</div>
          <div class="sr-title">${escapeHtml(s.title)}</div>
          <div class="sr-snippet">${escapeHtml((s.snippet||'').replace(/\[\[|\]\]/g,'').slice(0,90))}</div>
        </div>`).join('') : '<div class="sr-item">No matches.</div>'}</div>`;
      box.querySelectorAll('[data-nav]').forEach(el=>{
        el.onclick = ()=>{ nav('detail', el.getAttribute('data-param')); };
      });
    };
    searchInput.onkeydown = (e)=>{ if(e.key==='Enter'){ nav('search'); } };
  }
}

function openTypePicker(){
  const overlay = document.createElement('div');
  overlay.className='overlay';
  overlay.innerHTML = `<div class="modal" style="max-width:520px;">
    <h2>New Entry — choose a type</h2>
    <div class="card-grid">${TYPE_ORDER.map(t=>`<div class="entry-card" data-picktype="${t}" style="cursor:pointer;"><h4>${ENTRY_TYPES[t].label}</h4></div>`).join('')}</div>
    <div class="modal-actions"><button class="btn btn-ghost" id="cancelPick">Cancel</button></div>
  </div>`;
  document.body.appendChild(overlay);
  overlay.querySelector('#cancelPick').onclick = ()=>overlay.remove();
  overlay.addEventListener('click',(e)=>{ if(e.target===overlay) overlay.remove(); });
  overlay.querySelectorAll('[data-picktype]').forEach(el=>{
    el.onclick = ()=>{ const t = el.getAttribute('data-picktype'); overlay.remove(); openEditModal(t); };
  });
}

})();
